global:
  data_dir: "data"

exchanges:
  deribit:
    enabled: true
    sync_mode: "live_only"
    symbols:
      - "BTC"
    workers:
      options:
        enabled: true

  binance:
    enabled: false
    sync_mode: "live_only"
    symbols:
      - "BTC"
    workers:
      futures:
        enabled: true
      spot:
        enabled: true
      options:
        enabled: true
