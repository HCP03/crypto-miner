services:
  miner:
    build: .
    container_name: crypto_miner
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./workers/default_config.yaml:/app/workers/default_config.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
